# RawBoy iOS. Generate the Xcode project with `xcodegen` in this folder (RawBoy.xcodeproj is git-ignored).
# Needs the native frameworks first: native/build.sh. The develop shaders are generated from <repo>/shaders by
# shaders/gen.sh, before generating the project and again before every engine build.
# RawBoyEngine serves RawBoy, Auto and Camera and bundles the film stocks' LUTs (luts/spektrafilm,
# CC BY-SA 4.0).
name: RawBoy
options:
  bundleIdPrefix: app.rawboy
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
  preGenCommand: shaders/gen.sh && mediapipe/fetch.sh
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Owner's free Personal Team: apps on a device must be reinstalled from Xcode every 7 days.
    DEVELOPMENT_TEAM: PB2FFKSMC8
    CODE_SIGN_STYLE: Automatic
packages:
  # RawBoy Viewer's libraries (RawBoyBrowseKit, ViewerFiles, ViewerImaging, ViewerUI), switched by ios/viewer-source.sh:
  # `git` = the tag pinned in that script (the committed default: CI, releases), `local` = a sibling checkout for
  # development (`ios/viewer-source.sh local`; do not commit it). Run `xcodegen` after switching.
  # viewer-package:begin
  RawBoyViewerPackages:
    url: https://github.com/lexusag/RawBoyImageViewer
    from: 0.2.2
  # viewer-package:end
targets:
  RawBoyEngine:
    type: framework
    platform: iOS
    sources:
      - path: Engine
      - path: build/generated
        group: Generated
      - path: ../luts
        type: folder
        buildPhase: resources
      # The Lensfun lens database (CC BY-SA 3.0, data only), the web's copy: lens/LensfunData.swift.
      - path: ../web/public/lensfun
        type: folder
        buildPhase: resources
      - path: ../licenses/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: ../engine/src/main/assets/models
        buildPhase: resources
    preBuildScripts:
      - name: Generate develop shaders
        script: shaders/gen.sh
        inputFiles:
          - $(SRCROOT)/../shaders/develop.glsl
          - $(SRCROOT)/../shaders/develop.vert
          - $(SRCROOT)/../shaders/main_body.glsl
          - $(SRCROOT)/../shaders/film_form.glsl
          - $(SRCROOT)/../shaders/bokeh_prep.glsl
          - $(SRCROOT)/../shaders/scan.frag
          - $(SRCROOT)/shaders/gen.sh
        outputFiles:
          - $(SRCROOT)/build/generated/develop_vert.metal
          - $(SRCROOT)/build/generated/develop_frag.metal
          - $(SRCROOT)/build/generated/develop_export.metal
          - $(SRCROOT)/build/generated/bokeh_prep.metal
          - $(SRCROOT)/build/generated/scan.metal
          - $(SRCROOT)/build/generated/DevelopLayout.swift
    dependencies:
      - package: RawBoyViewerPackages
        product: RawBoyBrowseKit
      - framework: native/out/RawBoyNative.xcframework
        embed: false
      - framework: native/out/RawBoyJpeg.xcframework
        embed: false
      # MediaPipe Tasks (static; mediapipe/fetch.sh), linked into the engine with its graph library as the pods do.
      - framework: mediapipe/out/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework
        embed: false
      - framework: mediapipe/out/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreMedia.framework
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rawboy.engine
        GENERATE_INFOPLIST_FILE: YES
        MTL_LANGUAGE_REVISION: Metal21
        # Optimised in Debug too: the engine's pixel loops are ~10x slower unoptimised, and Debug is what goes on the phone.
        SWIFT_OPTIMIZATION_LEVEL: -O
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(inherited) -ObjC -force_load "$(SRCROOT)/mediapipe/out/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a"
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(inherited) -ObjC -force_load "$(SRCROOT)/mediapipe/out/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a"
  RawBoyAuto:
    type: application
    platform: iOS
    sources:
      - path: Auto
      # Pro's crop frame, shared (Auto's Crop & rotate).
      - path: Pro/ui/CropOverlay.swift
    dependencies:
      - package: RawBoyViewerPackages
        product: RawBoyBrowseKit
      - target: RawBoyEngine
      - framework: native/out/RawBoyNative.xcframework
      - framework: native/out/RawBoyJpeg.xcframework
    info:
      path: build/generated/Auto-Info.plist
      properties:
        CFBundleDisplayName: RawBoy Auto
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryUsageDescription: RawBoy Auto saves developed photos into its own album in your library.
        NSPhotoLibraryAddUsageDescription: RawBoy Auto saves developed photos to your library.
        # Never claimed by the OS: rank None, so Finder doesn't offer Desktop first or pick it for a type; it is still there
        # under Open With > Other, and takes the types RawBoy Viewer's Browse shows (RawBoyBrowseKit's PhotoFileType). Photos handed
        # over by the Finder open in Browse while Browse shows, else in Pro.
        CFBundleDocumentTypes:
          - CFBundleTypeName: RAW photo
            CFBundleTypeRole: Editor
            LSHandlerRank: None
            LSItemContentTypes: [public.camera-raw-image, com.adobe.raw-image, app.rawboy.kdc-raw-image, app.rawboy.x3f-raw-image]
          - CFBundleTypeName: Photo
            CFBundleTypeRole: Editor
            LSHandlerRank: None
            LSItemContentTypes: [public.jpeg, public.heic, public.heif, public.png, public.tiff, org.webmproject.webp, public.avif, public.jpeg-xl]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: app.rawboy.kdc-raw-image
            UTTypeDescription: Kodak raw image
            UTTypeConformsTo: [public.camera-raw-image]
            UTTypeTagSpecification: {public.filename-extension: [kdc]}
          - UTTypeIdentifier: app.rawboy.x3f-raw-image
            UTTypeDescription: Sigma X3F raw image
            UTTypeConformsTo: [public.camera-raw-image]
            UTTypeTagSpecification: {public.filename-extension: [x3f]}
        # RawBoy Viewer's "Send to RawBoy Auto": rawboy-desktop://auto?as=looks|film|plain&path=<file or folder>&path=…
        CFBundleURLTypes:
          - CFBundleURLName: app.rawboy.desktop.auto
            CFBundleURLSchemes: [rawboy-desktop]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rawboy.desktop
        PRODUCT_NAME: RawBoy Desktop
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RawBoyEngineTestsMac:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EngineTests
        excludes:
          - Fixtures
          - DeviceDngTests.swift
          - ViewfinderTests.swift
          - SkinTests.swift
      # Browse mode's real preview provider, tested here (it needs only the engine and ViewerImaging).
      - path: Desktop/EngineRealPreview.swift
    dependencies:
      - package: RawBoyViewerPackages
        product: ViewerImaging
      - package: RawBoyViewerPackages
        product: RawBoyBrowseKit
      - target: RawBoyEngineMac
      - framework: native/out/RawBoyNative.xcframework
      - framework: native/out/RawBoyJpeg.xcframework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.rawboy.engine.tests
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_IDENTITY: "-"
schemes:
  RawBoyDesktop:
    build:
      targets:
        RawBoyDesktop: all
    run:
      config: Debug
  RawBoyCamera:
    build:
      targets:
        RawBoyCamera: all
    run:
      config: Debug
  RawBoyPro:
    build:
      targets:
        RawBoyPro: all
    run:
      config: Debug
  RawBoyAuto:
    build:
      targets:
        RawBoyAuto: all
    run:
      config: Debug
  RawBoyEngineTests:
    build:
      targets:
        RawBoyEngineTests: all
    test:
      targets:
        - RawBoyEngineTests
  RawBoyEngineTestsMac:
    build:
      targets:
        RawBoyEngineTestsMac: all
    test:
      targets:
        - RawBoyEngineTestsMac
