<!doctype html><meta charset=utf-8><body><script>
(async () => {
  const W = 96, H = 64, SCALE = 1.5, w = Math.round(W * SCALE), h = Math.round(H * SCALE);
  const log = (m) => fetch('/log', { method: 'POST', body: String(m) });
  try {
    const [frag, bytes] = await Promise.all([fetch('/scan.frag').then(r => r.text()), fetch('/in.f16').then(r => r.arrayBuffer())]);
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl2');
    if (!gl || !gl.getExtension('EXT_color_buffer_float')) throw new Error('no webgl2 float targets');
    const vert = `#version 300 es
in vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vert)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, frag));
    gl.bindAttribLocation(prog, 0, 'aPos'); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const tex = (filter, fmt, tw, th, data, type) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      if (data) gl.texImage2D(gl.TEXTURE_2D, 0, fmt, tw, th, 0, gl.RGBA, type, data); else gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, tw, th); return t; };
    const src = tex(gl.LINEAR, gl.RGBA16F, W, H, new Uint16Array(bytes), gl.HALF_FLOAT);
    const hr = [tex(gl.NEAREST, gl.RGBA32F, w, h), tex(gl.NEAREST, gl.RGBA32F, w, h)];
    const residual = tex(gl.LINEAR, gl.RGBA16F, W, H), luma = tex(gl.NEAREST, gl.RGBA32F, w, h), blur = tex(gl.NEAREST, gl.RGBA32F, w, h), out = tex(gl.LINEAR, gl.RGBA16F, w, h);
    const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.useProgram(prog);
    const U = (n) => gl.getUniformLocation(prog, n);
    gl.uniform1i(U('uA'), 10); gl.uniform1i(U('uB'), 11); gl.uniform2f(U('uScale'), w / W, h / H);
    gl.uniform2i(U('uSrcSize'), W, H); gl.uniform2i(U('uHrSize'), w, h); gl.uniform1f(U('uAmount'), 1.0); gl.uniform1f(U('uThreshold'), 0.008 + 0 * 0.04);
    const run = (pass, a, b, target, tw, th) => { gl.uniform1i(U('uPass'), pass);
      gl.activeTexture(gl.TEXTURE0 + 10); gl.bindTexture(gl.TEXTURE_2D, a); gl.activeTexture(gl.TEXTURE0 + 11); gl.bindTexture(gl.TEXTURE_2D, b);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0); gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
      gl.viewport(0, 0, tw, th); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); };
    let cur = 0; run(0, src, null, hr[0], w, h);
    for (let i = 0; i < 4; i++) { run(1, hr[cur], src, residual, W, H); run(2, hr[cur], residual, hr[1 - cur], w, h); cur = 1 - cur; }
    run(3, hr[cur], null, luma, w, h); run(4, luma, null, blur, w, h); run(5, hr[cur], blur, out, w, h);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, out, 0);
    const px = new Float32Array(w * h * 4); gl.readPixels(0, 0, w, h, gl.RGBA, gl.FLOAT, px);
    const err = gl.getError();
    await fetch('/result', { method: 'POST', body: JSON.stringify({ w, h, err, data: Array.from(px) }) });
  } catch (e) { await log('ERROR ' + e.message); await fetch('/result', { method: 'POST', body: JSON.stringify({ error: e.message }) }); }
})();
</script>
