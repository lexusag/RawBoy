# Manual cleanup of old Cloudflare Pages deployments.
# Keeps the current production deployment plus the newest N deployments per project; deletes the rest.
# Defaults to a dry run: nothing is deleted unless "dry_run" is unticked.
# Uses the same secrets as release.yml: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.
name: Cloudflare cleanup

on:
  workflow_dispatch:
    inputs:
      project:
        description: Pages project to clean
        type: choice
        options: [all, rawboy, rawboy-packer]
        default: all
      keep:
        description: Number of newest deployments to keep (current production is always kept too)
        type: string
        default: "5"
      dry_run:
        description: Dry run - only list what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-cleanup

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_PROJECT: ${{ inputs.project }}
      INPUT_KEEP: ${{ inputs.keep }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Clean up deployments
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_KEEP" =~ ^[0-9]+$ ]] || { echo "keep must be a non-negative integer"; exit 1; }
          KEEP=$INPUT_KEEP
          if [ "$INPUT_PROJECT" = "all" ]; then PROJECTS="rawboy rawboy-packer"; else PROJECTS="$INPUT_PROJECT"; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"

          cf() { curl -sS --fail-with-body -H "Authorization: Bearer $CF_TOKEN" "$@"; }

          for P in $PROJECTS; do
            echo "::group::$P"
            PROD=$(cf "$API/$P" | jq -r '.result.canonical_deployment.id // empty')
            echo "Current production deployment: ${PROD:-none found}"

            # Collect all deployment ids, newest first.
            IDS=""
            PAGE=1
            while :; do
              RES=$(cf "$API/$P/deployments?per_page=25&page=$PAGE")
              BATCH=$(echo "$RES" | jq -r '.result[].id')
              [ -z "$BATCH" ] && break
              IDS="$IDS"$'\n'"$BATCH"
              TOTAL_PAGES=$(echo "$RES" | jq -r '.result_info.total_pages // 1')
              [ "$PAGE" -ge "$TOTAL_PAGES" ] && break
              PAGE=$((PAGE+1))
            done
            IDS=$(echo "$IDS" | sed '/^$/d')
            TOTAL=$(echo "$IDS" | sed '/^$/d' | wc -l)
            echo "Found $TOTAL deployments, keeping newest $KEEP + production"

            N=0; DEL=0
            while read -r ID; do
              [ -z "$ID" ] && continue
              N=$((N+1))
              if [ "$N" -le "$KEEP" ] || [ "$ID" = "$PROD" ]; then
                echo "keep   $ID"
                continue
              fi
              DEL=$((DEL+1))
              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete $ID"
              else
                echo "delete $ID"
                cf -X DELETE "$API/$P/deployments/$ID?force=true" -o /dev/null
              fi
            done <<< "$IDS"
            echo "$P: $DEL deployment(s) $([ "$DRY_RUN" = "true" ] && echo 'would be deleted (dry run)' || echo deleted)"
            echo "::endgroup::"
          done
