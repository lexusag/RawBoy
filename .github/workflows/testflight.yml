# Builds and archives RawBoy Camera (iOS), cloud-signs it for App Store Connect, and uploads it to TestFlight.
# Runs only by hand: Actions → "Publish to TestFlight" → Run workflow. Setup and usage: docs/ios-testflight.md.
#
# Secrets: APP_STORE_CONNECT_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
# (each falls back to the existing APPLE_NOTARY_* secrets if unset; the API key needs App Manager or Admin access).
#
# Version: MARKETING_VERSION comes from the `version` input (e.g. 1.0 or 1.6.2). CURRENT_PROJECT_VERSION comes from
# `build_number` if provided, otherwise GITHUB_RUN_NUMBER so every run gets a strictly higher build number.
name: Publish to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version shown to users (e.g. 1.0 or 1.6.2)
        required: true
      build_number:
        description: Build number (leave empty to use GitHub run number)
        required: false
        default: ""

permissions:
  contents: read

# One TestFlight upload at a time.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: RawBoy Camera (iOS TestFlight)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check inputs and credentials
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUILD_INPUT: ${{ inputs.build_number }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY || secrets.APPLE_NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          version="${VERSION_INPUT#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version '$VERSION_INPUT' must be X.Y or X.Y.Z (e.g. 1.0 or 1.6.2)"
            exit 1
          fi
          build="${BUILD_INPUT:-$GITHUB_RUN_NUMBER}"
          if [[ ! "$build" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Build number '$build' must be a positive integer"
            exit 1
          fi
          for var in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing $var — set APP_STORE_CONNECT_* or APPLE_NOTARY_* secrets (see docs/ios-testflight.md)"
              exit 1
            fi
          done
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "RawBoy Camera $version (build $build)"

      # Builds the branch or tag picked in "Use workflow from".
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: native
        with:
          path: ios/native/out
          key: ios-native-${{ runner.os }}-${{ hashFiles('engine/src/main/cpp/**', 'ios/native/**', 'engine/src/main/cpp/dng_sdk.cmake') }}

      - uses: actions/cache@v6
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: third_party/dng_sdk_1_7_1.zip
          key: dng_sdk_1_7_1.zip

      - name: Download Adobe DNG SDK
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cd third_party
          [ -f dng_sdk_1_7_1.zip ] || curl -fsSLO https://download.adobe.com/pub/adobe/dng/dng_sdk_1_7_1.zip
          unzip -q dng_sdk_1_7_1.zip && mv dng_sdk_1_7_1 dng_sdk

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen glslang spirv-cross
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build the native libraries (iOS slice)
        if: steps.native.outputs.cache-hit != 'true'
        run: ios/native/build.sh ios

      - uses: actions/cache@v6
        with:
          path: ios/mediapipe/out
          key: ios-mediapipe-${{ runner.os }}-${{ hashFiles('ios/mediapipe/fetch.sh') }}

      - name: RawBoy Viewer libraries
        id: viewer
        run: |
          if grep -q 'path: ../../RawBoyImageViewer' ios/project.yml; then
            ref="v$(sed -n 's/^VIEWER_FROM="${VIEWER_FROM:-\([^}]*\)}"/\1/p' ios/viewer-source.sh)"
            git clone --depth 1 --branch "$ref" https://github.com/lexusag/RawBoyImageViewer ../RawBoyImageViewer
          fi
          echo "pin=$(sed -n '/viewer-package:begin/,/viewer-package:end/p' ios/project.yml | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: viewer-spm-${{ runner.os }}-${{ steps.viewer.outputs.pin }}

      - name: Generate the project
        run: cd ios && xcodegen

      - name: Archive RawBoy Camera
        run: |
          cd ios
          xcodebuild archive \
            -project RawBoy.xcodeproj \
            -scheme RawBoyCamera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RawBoyCamera.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Sign and upload to TestFlight
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY || secrets.APPLE_NOTARY_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          export_plist="$RUNNER_TEMP/ExportOptions.plist"
          printf '%s' "$ASC_KEY" | tr -d '[:space:]' | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          cat > "$export_plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>PB2FFKSMC8</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RawBoyCamera.xcarchive" \
            -exportOptionsPlist "$export_plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Uploaded **RawBoy Camera $VERSION_NAME (build $BUILD_NUMBER)** to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
