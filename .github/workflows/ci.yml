# Pull request and main checks in one workflow, so a single required job ("pr-check") can gate merging.
#
# Path filtering is done by the `changes` job, not by `on.<event>.paths`: a workflow skipped by a workflow-level
# path filter never reports its checks, and a required check that never reports blocks the merge forever. Jobs
# skipped by `if:` report as skipped, and `pr-check` (always runs) turns "passed or legitimately skipped" into one
# green check.
#
# Branch protection / ruleset: require ONLY "pr-check". Add new jobs to `pr-check`'s `needs`.
#
# Android: fast compile & JVM unit-test check for pull requests: Kotlin + JUnit only, no NDK/CMake, no DNG SDK,
# no lint, no R8, no APK packaging. It catches compile errors and logic regressions in a few minutes instead of a
# full assembleDebug. The native build and the APKs stay in release.yml / play.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      pro: ${{ steps.filter.outputs.pro }}
      auto: ${{ steps.filter.outputs.auto }}
      camera: ${{ steps.filter.outputs.camera }}
      engine: ${{ steps.filter.outputs.engine }}
      desktop: ${{ steps.filter.outputs.desktop }}
      ios: ${{ steps.filter.outputs.ios }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - 'shaders/**'
              - 'luts/**'
              - 'engine/src/main/assets/models/**'
              - 'licenses/**'
              - '.github/workflows/ci.yml'
            # Everything all three apps (and the engine) are built from. A change here rebuilds every app.
            shared: &shared
              - 'engine/**'
              - 'shaders/**'
              - 'luts/**'
              - 'licenses/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
            # The apps are independent of each other: each depends on :engine and its own module only.
            engine: *shared
            pro:
              - *shared
              - 'app-pro/**'
            auto:
              - *shared
              - 'app-auto/**'
            camera:
              - *shared
              - 'app-camera/**'
            # RawBoy Desktop (macOS): the Swift engine, Pro's and the Desktop's sources, bundled resources, shaders and native code.
            desktop:
              - 'ios/**'
              - 'shaders/**'
              - 'luts/**'
              - 'web/public/lensfun/**'
              - 'engine/src/main/assets/models/**'
              - 'licenses/**'
              - 'engine/src/main/cpp/**'
              - '.github/workflows/ci.yml'
            # RawBoy iOS apps (Camera, Pro, Auto): the iOS engine, app targets, MediaPipe, shaders and native code.
            ios:
              - 'ios/Camera/**'
              - 'ios/Pro/**'
              - 'ios/Auto/**'
              - 'ios/Engine/**'
              - 'ios/native/**'
              - 'ios/mediapipe/**'
              - 'ios/shaders/**'
              - 'ios/project.yml'
              - 'ios/viewer-source.sh'
              - 'shaders/**'
              - 'luts/**'
              - 'web/public/lensfun/**'
              - 'engine/src/main/assets/models/**'
              - 'licenses/**'
              - 'engine/src/main/cpp/**'
              - '.github/workflows/ci.yml'
            # Changelog fragments and rollup tooling.
            changelog:
              - 'changelog/**'
              - 'CHANGELOG.md'
              - 'tools/changelog/**'
              - '.github/workflows/ci.yml'

  web:
    name: Web Build & Test
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build web application
        run: npm run build

  android:
    name: Android Kotlin compile & unit tests
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' || needs.changes.outputs.pro == 'true' ||
      needs.changes.outputs.auto == 'true' || needs.changes.outputs.camera == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the SDK platforms; this only accepts licences and adds anything missing.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # Gradle caches are written on main only; pull requests restore them read-only.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Compile and JVM unit-test tasks do not run CMake, so the NDK, CMake and third_party/dng_sdk are not needed.
      # Only the modules whose inputs changed: an app-only change restores :engine from the Gradle build cache and
      # checks that app, not the other two. Anything shared (engine, shaders, luts, Gradle files) turns every flag on.
      # Manual runs check everything.
      - name: Compile Kotlin & run JVM unit tests (changed modules)
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          PRO: ${{ needs.changes.outputs.pro }}
          AUTO: ${{ needs.changes.outputs.auto }}
          CAMERA: ${{ needs.changes.outputs.camera }}
          ENGINE: ${{ needs.changes.outputs.engine }}
        run: |
          tasks=":engine:compileDebugKotlin"
          [ "$ALL" = true ] && PRO=true AUTO=true CAMERA=true ENGINE=true
          [ "$ENGINE" = true ] && tasks="$tasks :engine:testDebugUnitTest"
          [ "$PRO" = true ] && tasks="$tasks :app-pro:compileDebugKotlin"
          [ "$AUTO" = true ] && tasks="$tasks :app-auto:compileDebugKotlin"
          [ "$CAMERA" = true ] && tasks="$tasks :app-camera:compileDebugKotlin :app-camera:testDebugUnitTest"
          echo "Tasks: $tasks"
          ./gradlew --parallel --configuration-cache --console=plain $tasks

  # RawBoy Desktop (macOS): builds the app and runs the Swift engine's tests on a Mac. The only check that compiles
  # the Swift code (iOS shares the engine and Pro's sources), so Swift written without a Mac at hand is checked here.
  # The native libraries (LibRaw, DNG SDK, jpegli: ~10 min) are cached by their sources' hash.
  desktop:
    name: Desktop (macOS) build & engine tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Runner images keep an older Xcode as the default; the project needs 26+ (see release.yml's desktop job).
      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen glslang spirv-cross
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v6
        id: native
        with:
          path: ios/native/out
          key: desktop-native-${{ runner.os }}-${{ hashFiles('engine/src/main/cpp/**', 'ios/native/**', 'engine/src/main/cpp/dng_sdk.cmake') }}

      - uses: actions/cache@v6
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: third_party/dng_sdk_1_7_1.zip
          key: dng_sdk_1_7_1.zip

      - name: Build the native libraries (macOS slice)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cd third_party
          [ -f dng_sdk_1_7_1.zip ] || curl -fsSLO https://download.adobe.com/pub/adobe/dng/dng_sdk_1_7_1.zip
          unzip -q dng_sdk_1_7_1.zip && mv dng_sdk_1_7_1 dng_sdk
          cd ..
          ios/native/build.sh macos

      # RawBoy Viewer's libraries (ios/project.yml's viewer-package block, switched by ios/viewer-source.sh).
      #  - git (default): SwiftPM fetches the pinned tag itself; the checkout is cached by the pin (the block's hash).
      #  - local (dev fallback): a sibling checkout of the tag pinned in ios/viewer-source.sh, where project.yml expects it.
      - name: RawBoy Viewer libraries
        id: viewer
        run: |
          if grep -q 'path: ../../RawBoyImageViewer' ios/project.yml; then
            ref="v$(sed -n 's/^VIEWER_FROM="${VIEWER_FROM:-\([^}]*\)}"/\1/p' ios/viewer-source.sh)"
            git clone --depth 1 --branch "$ref" https://github.com/lexusag/RawBoyImageViewer ../RawBoyImageViewer
          fi
          echo "pin=$(sed -n '/viewer-package:begin/,/viewer-package:end/p' ios/project.yml | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: viewer-spm-${{ runner.os }}-${{ steps.viewer.outputs.pin }}

      # project.yml's preGenCommand runs shaders/gen.sh and fetches MediaPipe (iOS only); macOS targets don't use MediaPipe.
      - name: Generate the project
        run: |
          cd ios
          sed -i '' 's| && mediapipe/fetch.sh||' project.yml
          xcodegen

      - name: Build RawBoy Desktop
        run: |
          cd ios
          set -o pipefail
          xcodebuild build -scheme RawBoyDesktop -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -E "error:" -B2 -A6 "$RUNNER_TEMP/build.log" | head -300; exit 1; }

      - name: Engine tests (macOS)
        run: |
          cd ios
          set -o pipefail
          xcodebuild test -scheme RawBoyEngineTestsMac -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E "error:|Test Case .*(failed|skipped)|Executed .* tests|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log" || { grep -E "error:|failed" -B2 -A6 "$RUNNER_TEMP/test.log" | head -300; exit 1; }

  # RawBoy iOS (Camera, Pro, Auto): compiles the iOS app targets against RawBoyEngine (device SDK, unsigned) so
  # iOS-only compile and module-visibility errors are caught on PRs instead of failing later in TestFlight.
  # Shares native, MediaPipe, and SwiftPM cache keys with testflight.yml.
  ios:
    name: iOS apps build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv -e beta -e rc | sort -V | tail -1)
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen glslang spirv-cross
          xcrun -f metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v6
        id: native
        with:
          path: ios/native/out
          key: ios-native-${{ runner.os }}-${{ hashFiles('engine/src/main/cpp/**', 'ios/native/**', 'engine/src/main/cpp/dng_sdk.cmake') }}

      - uses: actions/cache@v6
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: third_party/dng_sdk_1_7_1.zip
          key: dng_sdk_1_7_1.zip

      - name: Build the native libraries (iOS slice)
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cd third_party
          [ -f dng_sdk_1_7_1.zip ] || curl -fsSLO https://download.adobe.com/pub/adobe/dng/dng_sdk_1_7_1.zip
          unzip -q dng_sdk_1_7_1.zip && mv dng_sdk_1_7_1 dng_sdk
          cd ..
          ios/native/build.sh ios

      - uses: actions/cache@v6
        with:
          path: ios/mediapipe/out
          key: ios-mediapipe-${{ runner.os }}-${{ hashFiles('ios/mediapipe/fetch.sh') }}

      - name: RawBoy Viewer libraries
        id: viewer
        run: |
          if grep -q 'path: ../../RawBoyImageViewer' ios/project.yml; then
            ref="v$(sed -n 's/^VIEWER_FROM="${VIEWER_FROM:-\([^}]*\)}"/\1/p' ios/viewer-source.sh)"
            git clone --depth 1 --branch "$ref" https://github.com/lexusag/RawBoyImageViewer ../RawBoyImageViewer
          fi
          echo "pin=$(sed -n '/viewer-package:begin/,/viewer-package:end/p' ios/project.yml | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: viewer-spm-${{ runner.os }}-${{ steps.viewer.outputs.pin }}

      - name: Generate the project
        run: cd ios && xcodegen

      - name: Build iOS apps (Camera, Pro, Auto)
        run: |
          cd ios
          set -o pipefail
          for scheme in RawBoyCamera RawBoyPro RawBoyAuto; do
            echo "=== Building $scheme ==="
            log="$RUNNER_TEMP/build-$scheme.log"
            xcodebuild build -project RawBoy.xcodeproj -scheme "$scheme" -configuration Debug \
              -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "$log" || { grep -E "error:" -B2 -A6 "$log" | head -300; exit 1; }
          done

  changelog:
    name: Changelog check
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changelog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate changelog fragments and run rollup tests
        run: |
          node tools/changelog/rollup.mjs --check
          node --test tools/changelog/test.mjs

  # The one required check. Passes when every needed job succeeded or was skipped (nothing relevant changed);
  # fails when any failed or was cancelled. `always()` makes it run (and report) even when a dependency is skipped;
  # it runs on pull requests only.
  pr-check:
    name: pr-check
    needs: [changes, web, android, desktop, ios, changelog]
    # Only meaningful (and only required) on pull requests; pushes to main run the jobs above without it.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e '[.[].result] | any(. != "success" and . != "skipped")' >/dev/null; then
            echo "::error::A required job failed or was cancelled"
            exit 1
          fi
