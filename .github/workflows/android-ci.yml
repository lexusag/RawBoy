# Fast Android compile check for pull requests: Kotlin only, no NDK/CMake, no DNG SDK, no lint, no R8, no APK packaging.
# It catches what broke #276 (duplicate declarations, missing imports) in a few minutes instead of a full assembleDebug.
# The native build and the APKs stay in release.yml / play.yml.
name: Android CI

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'app-pro/**'
      - 'app-auto/**'
      - 'app-camera/**'
      - 'shaders/**'
      - 'luts/**'
      - 'licenses/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'app-pro/**'
      - 'app-auto/**'
      - 'app-camera/**'
      - 'shaders/**'
      - 'luts/**'
      - 'licenses/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  compile:
    name: Android Kotlin compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already has the SDK platforms; this only accepts licences and adds anything missing.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Gradle caches are written on main only; pull requests restore them read-only.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Compile-only tasks do not run CMake, so the NDK, CMake and third_party/dng_sdk are not needed.
      # The unit-test sources are compiled too (they are not run: that is for a later, slower job).
      - name: Compile Kotlin (all modules, with unit-test sources)
        run: >
          ./gradlew --parallel --configuration-cache --console=plain
          :engine:compileDebugKotlin :app-pro:compileDebugKotlin :app-auto:compileDebugKotlin :app-camera:compileDebugKotlin
          :engine:compileDebugUnitTestKotlin :app-camera:compileDebugUnitTestKotlin
