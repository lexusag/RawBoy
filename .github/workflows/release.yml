# Builds signed release APKs of all three apps (RawBoy, Auto, Camera) and attaches them to the GitHub release,
# and deploys the public web build to Cloudflare Pages (project "rawboy", and RawBoy Packer's page as project
# "rawboy-packer").
# Secrets: KEYSTORE_FILE (base64 of the .jks), KEYSTORE_PASS (store and key password; key alias "rawboy"),
# CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit), CLOUDFLARE_ACCOUNT_ID.
# Variable (optional): SITE_URL, overrides the web app's main address for search engines (default
# https://app.rawboy.link; see docs/cloudflare.md).
# The web deploy is skipped when nothing the web build reads changed since the commit the live site was built from
# (dist/deployed-commit.txt); run the workflow by hand with "Deploy the web build even if unchanged" to force it,
# and tick "Skip building the APKs" to only redeploy the website.
# Each app's APK is built only when something it reads changed since the last release with APKs: its own module, or
# anything shared (engine, shaders, luts, licences, Gradle files, third_party). The other apps' APKs from that release
# (named with its own tag) are attached to this one. "Build the APKs even if unchanged" forces all three.
# Publishing a release only dispatches this workflow on the default branch: caches saved by a run on a tag
# can't be restored by later tags, so the builds run on main (sources still come from the tag).
name: Release RawBoy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload APKs for
        required: true
      force_web:
        description: Deploy the web build even if unchanged
        type: boolean
        default: false
      skip_apks:
        description: Skip building the APKs (web deploy only)
        type: boolean
        default: false
      force_apks:
        description: Build the APKs even if unchanged
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the build on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY"
          --ref "${{ github.event.repository.default_branch }}" -f tag="$TAG"

  # Compares the tag with the newest other release that has APKs, per app. No such release (or an app missing from it)
  # counts as changed. Paths only the web, iOS or docs read are left out, so anything new counts as a shared change.
  apk-changes:
    if: github.event_name == 'workflow_dispatch' && !inputs.skip_apks
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      base: ${{ steps.check.outputs.base }}
      pro: ${{ steps.check.outputs.pro }}
      auto: ${{ steps.check.outputs.auto }}
      camera: ${{ steps.check.outputs.camera }}
    env:
      TAG: ${{ inputs.tag }}
      FORCE: ${{ inputs.force_apks }}
      GH_TOKEN: ${{ github.token }}
      NOT_APP_PATHS: >-
        :!web :!ios :!docs :!tools :!branding :!*.md :!.dockerignore :!app-pro :!app-auto :!app-camera
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check for app changes
        id: check
        run: |
          out() {  # out <pro> <auto> <camera>: which apps to build
            echo "pro=$1" >> "$GITHUB_OUTPUT"; echo "auto=$2" >> "$GITHUB_OUTPUT"; echo "camera=$3" >> "$GITHUB_OUTPUT"
            [ "$1$2$3" = falsefalsefalse ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
          }
          [ "$FORCE" = true ] && { echo "Forced build"; out true true true; exit 0; }
          base=
          for t in $(gh release list --exclude-drafts --limit 50 --json tagName -q '.[].tagName'); do
            [ "$t" = "$TAG" ] && continue
            n=$(gh release view "$t" --json assets -q '[.assets[].name | select(endswith(".apk"))] | length')
            [ "$n" -gt 0 ] && { base=$t; break; }
          done
          [ -n "$base" ] || { echo "No earlier release with APKs"; out true true true; exit 0; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git fetch --quiet --depth 1 origin tag "$base" || { echo "Tag $base not found"; out true true true; exit 0; }
          assets=$(gh release view "$base" --json assets -q '.assets[].name')
          shared=$(git diff --name-only "$base" HEAD -- . $NOT_APP_PATHS)
          [ -n "$shared" ] && echo "Shared changes since $base (every app rebuilds):" && echo "$shared"
          decide() {  # decide <output> <dir> <apk name in the base release>
            if [ -n "$shared" ]; then r=true
            elif ! echo "$assets" | grep -qx "$3"; then echo "$2: no APK in $base"; r=true
            elif [ -n "$(git diff --name-only "$base" HEAD -- "$2")" ]; then echo "$2 changed"; r=true
            else echo "$2 unchanged since $base"; r=false; fi
            eval "$1=$r"
          }
          decide pro app-pro "RawBoy-$base.apk"
          decide auto app-auto "RawBoy-Auto-$base.apk"
          decide camera app-camera "RawBoy-Camera-$base.apk"
          out $pro $auto $camera

  # Unchanged apps: attach the last build's APKs for them, unless this release already has them.
  apks-reuse:
    needs: apk-changes
    if: needs.apk-changes.outputs.pro == 'false' || needs.apk-changes.outputs.auto == 'false' || needs.apk-changes.outputs.camera == 'false'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      BASE: ${{ needs.apk-changes.outputs.base }}
      PRO: ${{ needs.apk-changes.outputs.pro }}
      AUTO: ${{ needs.apk-changes.outputs.auto }}
      CAMERA: ${{ needs.apk-changes.outputs.camera }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Copy APKs from ${{ needs.apk-changes.outputs.base }}
        run: |
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          reuse() {  # reuse <built flag> <name prefix>
            [ "$1" = false ] || return 0
            if echo "$have" | grep -q "^$2-v"; then echo "$TAG already has $2"; return 0; fi
            gh release download "$BASE" --repo "$GITHUB_REPOSITORY" --pattern "$2-$BASE.apk" --dir dist
          }
          reuse "$PRO" RawBoy
          reuse "$AUTO" RawBoy-Auto
          reuse "$CAMERA" RawBoy-Camera
          ls dist 2>/dev/null && gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.apk || true

  apks:
    needs: apk-changes
    if: needs.apk-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      PRO: ${{ needs.apk-changes.outputs.pro }}
      AUTO: ${{ needs.apk-changes.outputs.auto }}
      CAMERA: ${{ needs.apk-changes.outputs.camera }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The action's default packages include "tools", which the SDK no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;27.2.12479018 cmake;3.22.1

      - uses: gradle/actions/setup-gradle@v4

      # The C++ dependencies (LibRaw, DNG SDK, jpegli) rarely change between releases.
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-ndk27
          max-size: 1G
          verbose: 1

      # Release builds need the Adobe DNG SDK (git-ignored); see third_party/README.md.
      - uses: actions/cache@v4
        with:
          path: third_party/dng_sdk_1_7_1.zip
          key: dng_sdk_1_7_1.zip

      - name: Download Adobe DNG SDK
        run: |
          cd third_party
          [ -f dng_sdk_1_7_1.zip ] || curl -fsSLO https://download.adobe.com/pub/adobe/dng/dng_sdk_1_7_1.zip
          unzip -q dng_sdk_1_7_1.zip && mv dng_sdk_1_7_1 dng_sdk

      - name: Set up signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_FILE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=rawboy"
            echo "keyPassword=$KEYSTORE_PASS"
          } > keystore.properties

      # Tag vX.Y.Z -> versionName X.Y.Z, versionCode X*10000 + Y*100 + Z (so Y and Z stay below 100).
      - name: Version from tag
        run: |
          name="${TAG#v}"
          if [[ "$name" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          else
            echo "::error::Release tag '$TAG' must be vX.Y.Z with Y and Z below 100"; exit 1
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "versionName $name, versionCode $code"

      # CMake reads the launcher from the environment; AGP's CMake inherits it through the Gradle daemon.
      # COMPILERCHECK=content: the NDK is unpacked afresh each run, so its mtime (ccache's default check) changes.
      # Release APKs are arm64 only (x86_64 is for emulators; local builds keep it). Lint vital is skipped and
      # the three apps' R8 runs in parallel (more heap for that).
      - name: Build release APKs
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_COMPILERCHECK: content
        run: |
          tasks=
          [ "$PRO" = true ] && tasks="$tasks :app-pro:assembleRelease"
          [ "$AUTO" = true ] && tasks="$tasks :app-auto:assembleRelease"
          [ "$CAMERA" = true ] && tasks="$tasks :app-camera:assembleRelease"
          ./gradlew --parallel -Dorg.gradle.jvmargs="-Xmx8g -Dfile.encoding=UTF-8" \
            -x lintVitalRelease \
            -Prawboy.versionName="$VERSION_NAME" -Prawboy.versionCode="$VERSION_CODE" \
            -Prawboy.abis=arm64-v8a $tasks

      # Unsigned builds are named *-release-unsigned.apk, so a signing problem fails here.
      - name: Collect APKs
        run: |
          mkdir dist
          [ "$PRO" = true ] && cp app-pro/build/outputs/apk/release/app-pro-release.apk "dist/RawBoy-$TAG.apk"
          [ "$AUTO" = true ] && cp app-auto/build/outputs/apk/release/app-auto-release.apk "dist/RawBoy-Auto-$TAG.apk"
          [ "$CAMERA" = true ] && cp app-camera/build/outputs/apk/release/app-camera-release.apk "dist/RawBoy-Camera-$TAG.apk"
          true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.apk --clobber

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

  # Compares the tag with the commit the live site was built from. No marker on the site (first deploy, or it
  # can't be fetched) counts as changed.
  web-changes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    env:
      TAG: ${{ inputs.tag }}
      FORCE: ${{ inputs.force_web }}
      # Production URL of the Cloudflare Pages project.
      SITE: https://rawboy.pages.dev
      # Everything build:public reads: the web app, the shared shaders, LUTs, native engine, models and licences.
      WEB_PATHS: >-
        web shaders luts engine/src/main/cpp engine/src/main/assets/models licenses third_party
        .github/workflows/release.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check for web changes
        id: check
        run: |
          deploy() { echo "$1"; echo "deploy=$2" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$FORCE" = true ] && deploy "Forced deploy" true
          base=$(curl -fsSL --max-time 30 "$SITE/deployed-commit.txt" | tr -d '[:space:]') || true
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || deploy "No deployed commit on the live site" true
          git fetch --quiet --depth 1 origin "$base" || deploy "Deployed commit $base not found" true
          changed=$(git diff --name-only "$base" HEAD -- $WEB_PATHS)
          [ -n "$changed" ] || deploy "No web changes since ${base:0:7}" false
          echo "Changed since ${base:0:7}:"
          deploy "$changed" true

  web:
    needs: web-changes
    if: needs.web-changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      # Emscripten's prebuilt system libraries (libc, libc++ with pthreads/exceptions), kept between runs.
      EM_CACHE: ${{ github.workspace }}/.em_cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # build:public needs the Adobe DNG SDK for rawboy-full.wasm.
      - uses: actions/cache@v4
        with:
          path: third_party/dng_sdk_1_7_1.zip
          key: dng_sdk_1_7_1.zip

      - name: Download Adobe DNG SDK
        run: |
          cd third_party
          [ -f dng_sdk_1_7_1.zip ] || curl -fsSLO https://download.adobe.com/pub/adobe/dng/dng_sdk_1_7_1.zip
          unzip -q dng_sdk_1_7_1.zip && mv dng_sdk_1_7_1 dng_sdk

      # Same Emscripten as web/Dockerfile. Installed at a fixed path: setup-emsdk used a new temp dir each run,
      # which cleared EM_CACHE ("config changed") and changed the header paths ccache hashes.
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-6.0.12

      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.12
          ~/emsdk/emsdk activate 6.0.12

      - uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE }}
          key: em-cache-6.0.12-${{ hashFiles('web/native/CMakeLists.txt') }}
          restore-keys: em-cache-6.0.12-

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: emsdk-6.0.12
          max-size: 1G
          verbose: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        env:
          EM_COMPILER_WRAPPER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          # Canonical URL, sitemap and link previews (vite.config.ts); empty = app.rawboy.link.
          SITE_URL: ${{ vars.SITE_URL }}
          # The version the "?" sheets show (vite.config.ts): the release tag, as the APKs' versionName.
          RAWBOY_VERSION: ${{ inputs.tag }}
          # Google Drive (docs/google-drive.md): public values, so repository variables. Unset = no Drive buttons.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
        run: |
          source ~/emsdk/emsdk_env.sh > /dev/null
          npm ci && npm run build:public
          git rev-parse HEAD > dist/deployed-commit.txt

      # The tag checkout is a detached HEAD, so name the production branch or the deploy becomes a preview.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name rawboy --branch main

      # RawBoy Packer (web/packer.html) is its own site: the same build, with packer.html as its index page.
      - name: Prepare RawBoy Packer site
        working-directory: web
        run: |
          cp -r dist dist-packer
          cd dist-packer
          mv packer.html index.html
          rm -f drive.html about.html privacy.html privacy-android.html sitemap.xml manifest.webmanifest
          printf 'User-agent: *\nAllow: /\n' > robots.txt

      - name: Deploy RawBoy Packer to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist-packer --project-name rawboy-packer --branch main
