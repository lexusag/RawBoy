<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>RawBoy · Google Drive</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Served without the cross-origin isolation headers (public/_headers, nginx.conf, vite.config.ts): Google's
         Picker runs in iframes that a require-corp page would block. See src/drive/popup.ts. -->
    <style>
      html, body { margin: 0; height: 100%; background: #121212; color: #ececec; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 16px; box-sizing: border-box; text-align: center; }
      .error { color: #ff8a80; }
      /* Above the Picker's backdrop (z-index ~1000), in the space popup.ts leaves under it. */
      #tip { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3000; padding: 8px 16px; background: #1c1c1e; color: #9a9aa2; font-size: 13px; line-height: 1.4; text-align: center; }
      #tip a { color: #e8a33d; }
    </style>
  </head>
  <body>
    <main><p id="status">Connecting to Google Drive…</p></main>
    <!-- Google's Picker needs Google's cookies in its docs.google.com frame; with third-party cookies blocked it fails
         with "The API developer key is invalid" or stays blank. -->
    <footer id="tip">
      Error, or a blank window? Google's file picker needs third-party cookies:
      <a href="about.html#google-drive-cookies" target="_blank" rel="noopener">allow them for this site</a>.
    </footer>
    <script type="module" src="/src/drive/popup.ts"></script>
  </body>
</html>
