# RawBoy Web in the Docker image (see Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml;

    # The WASM decoder uses threads: the page must be cross-origin isolated.
    # add_header doesn't inherit into locations that set their own, so each location includes these.
    set $coop "same-origin";
    set $coep "require-corp";

    location / {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # The Google Drive window, without the isolation headers: Google's Picker runs in iframes require-corp would block.
    location ~ ^/drive(\.html)?$ {
        add_header Cache-Control "no-cache";
        try_files /drive.html =404;
    }

    # Vite's hashed bundles never change.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Emscripten's ES module loader; older nginx mime.types don't map .mjs.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        add_header Cache-Control "no-cache";
    }
}
